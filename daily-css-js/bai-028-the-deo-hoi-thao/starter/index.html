<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Bài 028 - Thẻ đeo hội thảo</title>
		<link rel="stylesheet" href="../../build/tailwind.css" />
	</head>
	<body class="relative min-h-screen overflow-clip bg-linear-to-br from-slate-950 via-indigo-950 to-fuchsia-950 p-4 font-sans text-white">
		<div aria-hidden="true" class="absolute -top-16 -left-16 size-64 rounded-full bg-cyan-400/40"></div>
		<div aria-hidden="true" class="absolute top-72 -right-16 size-72 rounded-full bg-fuchsia-500/50"></div>
		<main data-app class="relative mx-auto max-w-sm">
			<h1 class="text-xl font-bold">Thẻ đeo hội thảo</h1>
			<p class="mt-1 text-sm text-white/70">Rê chuột lên thẻ để nghiêng 3D, bấm "Lật thẻ" để xem mặt sau.</p>
			<div data-stage class="relative mt-6 perspective-distant">
				<article data-card aria-label="Xem trước thẻ đeo" class="group relative h-56 transform-3d rounded-3xl shadow-(--shadow) rotate-x-(--rx) rotate-y-(--ry) transition-transform duration-300 ease-out data-tracking:duration-75 motion-reduce:transition-none">
					<div class="absolute inset-0 transform-3d transition-transform duration-700 ease-out group-data-flipped:rotate-y-180 motion-reduce:transition-none">
						<section data-side="front" class="absolute inset-0 isolate overflow-clip rounded-3xl border border-white/25 bg-white/10 inset-ring-1 inset-ring-white/20 backdrop-blur-md backface-hidden">
							<div aria-hidden="true" class="pointer-events-none absolute inset-0 bg-[linear-gradient(115deg,#ff7ab8,#ffd36e,#6effc4,#6ec6ff,#c28aff,#ff7ab8)] opacity-35"></div>
							<div aria-hidden="true" class="pointer-events-none mix-blend-overlay absolute inset-0 bg-[radial-gradient(circle_at_var(--mx)_var(--my),rgb(255_255_255/0.55),transparent_55%)] opacity-0 transition-opacity duration-300 group-data-tracking:opacity-100 motion-reduce:transition-none"></div>
							<div class="relative flex h-full flex-col justify-between p-5">
								<p class="text-xs font-semibold tracking-widest text-white/70 uppercase">DevFest Đà Nẵng 2026</p>
								<p data-bind="role" class="w-fit rounded-full bg-white/20 px-3 py-0.5 text-xs font-semibold"></p>
								<p data-bind="holder" class="truncate text-2xl font-bold"></p>
								<p data-bind="code" class="font-mono text-sm tracking-widest tabular-nums text-white/80"></p>
							</div>
						</section>
						<section data-side="back" class="absolute inset-0 isolate rotate-y-180 overflow-clip rounded-3xl border border-white/25 bg-white/10 inset-ring-1 inset-ring-white/20 backdrop-blur-md backface-hidden">
							<div aria-hidden="true" class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_var(--mx)_var(--my),rgb(255_255_255/0.55),transparent_55%)] opacity-0 transition-opacity duration-300 group-data-tracking:opacity-100 motion-reduce:transition-none"></div>
							<div class="relative flex h-full flex-col items-center justify-between p-5">
								<p class="text-xs font-semibold tracking-widest text-white/70 uppercase">Quét tại cổng vào</p>
								<div data-barcode aria-hidden="true" class="flex h-16 items-stretch gap-0.5"></div>
								<p data-bind="code" class="font-mono text-sm tracking-widest tabular-nums text-white/80"></p>
								<p data-expiry class="text-xs text-white/60"></p>
							</div>
						</section>
					</div>
				</article>
			</div>
			<button type="button" data-flip aria-pressed="false" class="mt-6 w-full rounded-xl bg-white/90 px-4 py-2 text-sm font-semibold text-indigo-950 transition-transform hover:-translate-y-0.5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white motion-reduce:transition-none">Lật thẻ</button>
			<form data-form novalidate class="mt-6 space-y-3">
				<label class="block text-xs text-white/70">
					Họ và tên
					<input name="holder" required minlength="2" maxlength="24" autocomplete="off" class="mt-1 w-full rounded-xl border border-white/25 bg-white/10 px-3 py-2 text-sm text-white aria-invalid:border-rose-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white" />
					<span data-error="holder" class="mt-1 block min-h-4 text-rose-300"></span>
				</label>
				<label class="block text-xs text-white/70">
					Vai trò
					<select name="role" class="mt-1 w-full rounded-xl border border-white/25 bg-white/10 px-3 py-2 text-sm text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">
						<option value="Diễn giả" class="text-slate-900">Diễn giả</option>
						<option value="Tình nguyện viên" class="text-slate-900">Tình nguyện viên</option>
						<option value="Người tham dự" class="text-slate-900">Người tham dự</option>
					</select>
				</label>
				<label class="block text-xs text-white/70">
					Mã vé (ví dụ DEV-1236)
					<input name="code" required maxlength="8" autocomplete="off" class="mt-1 w-full rounded-xl border border-white/25 bg-white/10 px-3 py-2 font-mono text-sm tracking-widest text-white aria-invalid:border-rose-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white" />
					<span data-error="code" class="mt-1 block min-h-4 text-rose-300"></span>
				</label>
			</form>
			<template data-bar-template>
				<span data-bar class="w-(--w) bg-white/90"></span>
			</template>
		</main>
		<script src="script.js"></script>
	</body>
</html>
