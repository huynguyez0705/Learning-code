<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Bài 011 - Xem căn hộ 3D</title>
		<link rel="stylesheet" href="../../build/tailwind.css" />
	</head>
	<body class="bg-stone-100 font-sans leading-normal text-stone-900">
		<main class="mx-auto min-h-screen max-w-md overflow-x-hidden px-6 py-10">
			<h1 class="text-2xl font-bold">Xem căn hộ mẫu</h1>
			<p class="mt-1 text-sm text-stone-600">Xoay vòng quanh 6 căn hộ đang mở bán.</p>
			<div data-scene class="mx-auto mt-12 h-56 w-48">
				<ul data-ring class="relative h-full w-full transition-transform duration-700 motion-reduce:transition-none">
					<li data-panel data-name="Căn hộ Sen Hồng" data-area="54" data-price="2650000000" data-bedrooms="2" style="--i: 0" class="group absolute inset-0 transform-3d rotate-y-[calc(var(--i)*60deg)]">
						<div class="flex h-full flex-col justify-end rounded-2xl bg-linear-to-br from-amber-400 to-orange-600 p-4 text-white shadow-lg opacity-40 transition-opacity duration-500 motion-reduce:transition-none backface-hidden group-data-active:opacity-100 translate-z-42">
							<p class="text-sm">2 phòng ngủ</p>
							<h2 class="text-xl font-bold">Căn hộ Sen Hồng</h2>
						</div>
					</li>
					<li data-panel data-name="Căn hộ Lan Anh" data-area="68" data-price="3400000000" data-bedrooms="2" style="--i: 1" class="group absolute inset-0 transform-3d rotate-y-[calc(var(--i)*60deg)]">
						<div class="flex h-full flex-col justify-end rounded-2xl bg-linear-to-br from-rose-400 to-pink-600 p-4 text-white shadow-lg opacity-40 transition-opacity duration-500 motion-reduce:transition-none backface-hidden group-data-active:opacity-100 translate-z-42">
							<p class="text-sm">2 phòng ngủ</p>
							<h2 class="text-xl font-bold">Căn hộ Lan Anh</h2>
						</div>
					</li>
					<li data-panel data-name="Căn hộ Mây Trắng" data-area="72" data-price="3900000000" data-bedrooms="3" style="--i: 2" class="group absolute inset-0 transform-3d rotate-y-[calc(var(--i)*60deg)]">
						<div class="flex h-full flex-col justify-end rounded-2xl bg-linear-to-br from-sky-400 to-blue-600 p-4 text-white shadow-lg opacity-40 transition-opacity duration-500 motion-reduce:transition-none backface-hidden group-data-active:opacity-100 translate-z-42">
							<p class="text-sm">3 phòng ngủ</p>
							<h2 class="text-xl font-bold">Căn hộ Mây Trắng</h2>
						</div>
					</li>
					<li data-panel data-name="Căn hộ Hoa Sữa" data-area="45" data-price="2100000000" data-bedrooms="1" style="--i: 3" class="group absolute inset-0 transform-3d rotate-y-[calc(var(--i)*60deg)]">
						<div class="flex h-full flex-col justify-end rounded-2xl bg-linear-to-br from-emerald-400 to-teal-600 p-4 text-white shadow-lg opacity-40 transition-opacity duration-500 motion-reduce:transition-none backface-hidden group-data-active:opacity-100 translate-z-42">
							<p class="text-sm">1 phòng ngủ</p>
							<h2 class="text-xl font-bold">Căn hộ Hoa Sữa</h2>
						</div>
					</li>
					<li data-panel data-name="Căn hộ Thạch Thảo" data-area="85" data-price="5200000000" data-bedrooms="3" style="--i: 4" class="group absolute inset-0">
						<div class="flex h-full flex-col justify-end rounded-2xl bg-linear-to-br from-violet-400 to-purple-600 p-4 text-white shadow-lg opacity-40 transition-opacity duration-500 motion-reduce:transition-none backface-hidden group-data-active:opacity-100">
							<p class="text-sm">3 phòng ngủ</p>
							<h2 class="text-xl font-bold">Căn hộ Thạch Thảo</h2>
						</div>
					</li>
					<li data-panel data-name="Căn hộ Bình Minh" data-area="60" data-price="3000000000" data-bedrooms="2" style="--i: 5" class="group absolute inset-0">
						<div class="flex h-full flex-col justify-end rounded-2xl bg-linear-to-br from-lime-400 to-green-600 p-4 text-white shadow-lg opacity-40 transition-opacity duration-500 motion-reduce:transition-none backface-hidden group-data-active:opacity-100">
							<p class="text-sm">2 phòng ngủ</p>
							<h2 class="text-xl font-bold">Căn hộ Bình Minh</h2>
						</div>
					</li>
				</ul>
			</div>
			<p data-info aria-live="polite" class="mt-12 text-center text-sm font-medium tabular-nums"></p>
			<div class="mt-4 flex items-center justify-center gap-4">
				<button type="button" data-prev class="rounded-lg bg-amber-600 px-4 py-2 font-medium text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-600 disabled:cursor-not-allowed disabled:bg-stone-300 disabled:text-stone-500">← Trước</button>
				<div data-dots class="flex gap-2">
				<button type="button" data-go="0" aria-label="Xem căn 1" class="size-3 rounded-full bg-stone-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-600 data-active:bg-amber-600"></button>
				<button type="button" data-go="1" aria-label="Xem căn 2" class="size-3 rounded-full bg-stone-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-600 data-active:bg-amber-600"></button>
				<button type="button" data-go="2" aria-label="Xem căn 3" class="size-3 rounded-full bg-stone-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-600 data-active:bg-amber-600"></button>
				<button type="button" data-go="3" aria-label="Xem căn 4" class="size-3 rounded-full bg-stone-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-600 data-active:bg-amber-600"></button>
				<button type="button" data-go="4" aria-label="Xem căn 5" class="size-3 rounded-full bg-stone-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-600 data-active:bg-amber-600"></button>
				<button type="button" data-go="5" aria-label="Xem căn 6" class="size-3 rounded-full bg-stone-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-600 data-active:bg-amber-600"></button>
				</div>
				<button type="button" data-next class="rounded-lg bg-amber-600 px-4 py-2 font-medium text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-600 disabled:cursor-not-allowed disabled:bg-stone-300 disabled:text-stone-500">Sau →</button>
			</div>
		</main>
		<script src="script.js"></script>
	</body>
</html>
