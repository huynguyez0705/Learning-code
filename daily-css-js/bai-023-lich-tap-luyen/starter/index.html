<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Bài 023 - Lịch tập luyện</title>
		<link rel="stylesheet" href="../../build/tailwind.css" />
	</head>
	<body class="min-h-screen bg-stone-100 p-4 font-sans leading-normal text-stone-900">
		<main data-app class="mx-auto max-w-sm overflow-hidden rounded-3xl bg-white shadow-lg">
			<header class="from-orange-400 to-fuchsia-600 px-5 pt-5 pb-4 text-white">
				<div class="flex items-center justify-between">
					<button type="button" data-prev aria-label="Tháng trước" class="grid h-9 w-9 place-items-center rounded-full bg-white/20 text-xl transition-colors hover:bg-white/30 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white motion-reduce:transition-none">‹</button>
					<h1 data-title aria-live="polite" class="text-lg font-bold"></h1>
					<button type="button" data-next aria-label="Tháng sau" class="grid h-9 w-9 place-items-center rounded-full bg-white/20 text-xl transition-colors hover:bg-white/30 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white motion-reduce:transition-none">›</button>
				</div>
				<p data-summary class="mt-2 text-center text-sm text-white/80"></p>
			</header>
			<div class="p-4">
				<div class="grid grid-cols-7 text-center text-xs font-semibold text-stone-500" aria-hidden="true">
					<span>T2</span>
					<span>T3</span>
					<span>T4</span>
					<span>T5</span>
					<span>T6</span>
					<span>T7</span>
					<span>CN</span>
				</div>
				<div data-grid class="mt-1 grid grid-cols-7 gap-1"></div>
				<p data-detail aria-live="polite" class="mt-3 rounded-xl bg-stone-50 p-3 text-sm text-stone-700">Chọn một ngày để xem chi tiết.</p>
			</div>
			<template data-blank-template>
				<span data-blank aria-hidden="true"></span>
			</template>
			<template data-day-template>
				<button type="button" data-day aria-pressed="false" class="h-10 rounded-xl border-2 border-transparent bg-stone-100 text-sm font-medium transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rose-500 motion-reduce:transition-none data-[level=1]:bg-orange-100 data-[level=2]:bg-orange-300 data-[level=3]:bg-rose-400 data-[level=3]:text-white data-today:border-stone-900 aria-pressed:bg-linear-to-br aria-pressed:from-orange-500 aria-pressed:to-fuchsia-600 aria-pressed:text-white disabled:cursor-not-allowed disabled:text-stone-400"></button>
			</template>
		</main>
		<script src="script.js"></script>
	</body>
</html>
