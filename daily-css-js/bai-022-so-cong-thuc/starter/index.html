<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Bài 022 - Sổ công thức</title>
		<link rel="stylesheet" href="../../build/tailwind.css" />
	</head>
	<body class="min-h-screen bg-slate-900 p-4 font-sans leading-normal text-slate-100">
		<div data-app class="mx-auto max-w-md rounded-3xl border border-white/10 bg-slate-950">
			<header class="sticky top-0 z-30 flex h-14 items-center justify-between rounded-t-3xl border-b border-white/10 bg-slate-900/80 px-4 backdrop-blur-md">
				<h1 class="text-lg font-bold">Sổ công thức</h1>
				<button type="button" data-only-favorites aria-pressed="false" class="relative rounded-full border border-white/20 px-3 py-1 text-sm hover:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-400 aria-pressed:border-rose-400 aria-pressed:bg-rose-500/20 aria-pressed:text-rose-200">
					Yêu thích
					<span data-fav-count hidden class="absolute -top-1.5 -right-1.5 grid min-w-5 place-items-center rounded-full bg-rose-500 px-1 text-xs font-bold text-white">0</span>
				</button>
			</header>
			<div class="flex flex-col gap-3 border-b border-white/10 bg-slate-900/80 px-4 py-3 backdrop-blur-md">
				<label for="search" class="sr-only">Tìm công thức</label>
				<input id="search" data-search type="search" autocomplete="off" placeholder="Tìm món, ví dụ: ga xao" class="w-full rounded-lg border border-slate-600 bg-slate-800 px-3 py-2 text-sm text-slate-100 placeholder:text-slate-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-400" />
				<div role="group" aria-label="Lọc theo loại món" class="flex flex-wrap gap-2">
					<button type="button" data-tag="all" aria-pressed="true" class="rounded-full border border-white/20 px-3 py-1 text-sm hover:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-400 aria-pressed:border-sky-400 aria-pressed:bg-sky-500/20 aria-pressed:text-sky-200">Tất cả</button>
					<button type="button" data-tag="an-sang" aria-pressed="false" class="rounded-full border border-white/20 px-3 py-1 text-sm hover:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-400 aria-pressed:border-sky-400 aria-pressed:bg-sky-500/20 aria-pressed:text-sky-200">Ăn sáng</button>
					<button type="button" data-tag="mon-chinh" aria-pressed="false" class="rounded-full border border-white/20 px-3 py-1 text-sm hover:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-400 aria-pressed:border-sky-400 aria-pressed:bg-sky-500/20 aria-pressed:text-sky-200">Món chính</button>
					<button type="button" data-tag="trang-mieng" aria-pressed="false" class="rounded-full border border-white/20 px-3 py-1 text-sm hover:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-400 aria-pressed:border-sky-400 aria-pressed:bg-sky-500/20 aria-pressed:text-sky-200">Tráng miệng</button>
				</div>
				<p data-status aria-live="polite" class="text-xs text-slate-400"></p>
			</div>
			<main class="p-4">
				<p data-empty hidden class="rounded-2xl border border-dashed border-white/20 p-6 text-center text-sm text-slate-400">Không có công thức nào khớp.</p>
				<ul data-list class="flex flex-col gap-3"></ul>
			</main>
			<template data-recipe-template>
				<li data-card class="group relative rounded-2xl border border-white/10 bg-slate-900/70 p-4 data-selected:border-sky-400 data-selected:bg-slate-800">
					<div class="flex items-start justify-between gap-3">
						<h2>
							<button type="button" data-open aria-expanded="false" data-name class="text-left text-base font-semibold focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-sky-400"></button>
						</h2>
						<button type="button" data-fav aria-pressed="false" class="rounded-full bg-white/10 px-3 py-1 text-sm hover:bg-white/20 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-400 aria-pressed:bg-rose-500/30 aria-pressed:text-rose-200"></button>
					</div>
					<p data-meta class="mt-1 text-xs text-slate-400"></p>
					<p data-details class="mt-3 hidden text-sm text-slate-300 group-data-selected:block"></p>
				</li>
			</template>
		</div>
		<script src="script.js"></script>
	</body>
</html>
