<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Bài 013 - Đặt bàn nhà hàng</title>
		<link rel="stylesheet" href="../../build/tailwind.css" />
	</head>
	<body class="bg-emerald-50 font-sans leading-normal text-zinc-900">
		<header class="bg-linear-to-br from-emerald-600 to-teal-700 px-6 py-10 text-white">
			<h1 class="mx-auto max-w-xl text-2xl font-bold">Đặt bàn Quán Lá Sen</h1>
			<p class="mx-auto mt-1 max-w-xl text-sm text-emerald-100">Tối nay, sáu khung giờ, mỗi khung giờ một bàn.</p>
		</header>
		<main class="mx-auto max-w-xl px-6 py-8">
			<form data-form novalidate class="flex flex-col gap-5 rounded-2xl border border-emerald-100 bg-white p-5 shadow-sm">
				<fieldset>
					<legend class="text-sm font-semibold">Chọn khung giờ</legend>
					<div class="mt-2 grid grid-cols-3 gap-2">
						<label>
							<input type="radio" name="slot" value="17:30" class="peer sr-only" />
							<span class="block cursor-pointer rounded-lg border border-zinc-300 bg-white py-2 text-center text-sm font-medium text-zinc-700 transition-colors motion-reduce:transition-none peer-checked:border-emerald-600 peer-checked:bg-emerald-600 peer-checked:text-white peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-emerald-600 peer-disabled:cursor-not-allowed peer-disabled:border-zinc-200 peer-disabled:bg-zinc-100 peer-disabled:text-zinc-400">17:30</span>
						</label>
						<label>
							<input type="radio" name="slot" value="18:00" class="peer sr-only" />
							<span class="block cursor-pointer rounded-lg border border-zinc-300 bg-white py-2 text-center text-sm font-medium text-zinc-700 transition-colors motion-reduce:transition-none peer-checked:border-emerald-600 peer-checked:bg-emerald-600 peer-checked:text-white peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-emerald-600 peer-disabled:cursor-not-allowed peer-disabled:border-zinc-200 peer-disabled:bg-zinc-100 peer-disabled:text-zinc-400">18:00</span>
						</label>
						<label>
							<input type="radio" name="slot" value="18:30" class="peer sr-only" />
							<span class="block cursor-pointer rounded-lg border border-zinc-300 bg-white py-2 text-center text-sm font-medium text-zinc-700 transition-colors motion-reduce:transition-none peer-checked:border-emerald-600 peer-checked:bg-emerald-600 peer-checked:text-white peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-emerald-600 peer-disabled:cursor-not-allowed peer-disabled:border-zinc-200 peer-disabled:bg-zinc-100 peer-disabled:text-zinc-400">18:30</span>
						</label>
						<label>
							<input type="radio" name="slot" value="19:00" class="peer sr-only" />
							<span class="block cursor-pointer rounded-lg border border-zinc-300 bg-white py-2 text-center text-sm font-medium text-zinc-700 transition-colors motion-reduce:transition-none peer-checked:border-emerald-600 peer-checked:bg-emerald-600 peer-checked:text-white peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-emerald-600 peer-disabled:cursor-not-allowed peer-disabled:border-zinc-200 peer-disabled:bg-zinc-100 peer-disabled:text-zinc-400">19:00</span>
						</label>
						<label>
							<input type="radio" name="slot" value="19:30" />
							<span class="block cursor-pointer rounded-lg border border-zinc-300 bg-white py-2 text-center text-sm font-medium text-zinc-700 transition-colors motion-reduce:transition-none">19:30</span>
						</label>
						<label>
							<input type="radio" name="slot" value="20:00" />
							<span class="block cursor-pointer rounded-lg border border-zinc-300 bg-white py-2 text-center text-sm font-medium text-zinc-700 transition-colors motion-reduce:transition-none">20:00</span>
						</label>
					</div>
				</fieldset>
				<div>
					<label for="guest-name" class="block text-sm font-semibold">Tên người đặt</label>
					<input id="guest-name" type="text" name="name" data-name autocomplete="off" class="mt-1 block w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600" />
				</div>
				<div class="flex items-center justify-between">
					<span class="block text-sm font-semibold">Số khách</span>
					<div data-stepper class="flex items-center gap-3">
						<button type="button" data-step="-1" aria-label="Giảm số khách" class="size-9 rounded-full border border-zinc-300 text-lg font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600 disabled:cursor-not-allowed disabled:text-zinc-300">−</button>
						<output data-guests-output class="w-8 text-center font-semibold tabular-nums">2</output>
						<button type="button" data-step="1" aria-label="Tăng số khách" class="size-9 rounded-full border border-zinc-300 text-lg font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600 disabled:cursor-not-allowed disabled:text-zinc-300">+</button>
					</div>
				</div>
				<p data-message role="status" class="min-h-5 text-sm data-[type=error]:text-rose-600 data-[type=success]:text-emerald-700"></p>
				<button type="submit" class="rounded-lg bg-emerald-600 px-4 py-2.5 font-semibold text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600">Đặt bàn</button>
			</form>
			<section>
				<h2 data-list-title tabindex="-1" class="mt-8 text-lg font-semibold">Danh sách đặt bàn</h2>
				<p data-empty class="mt-3 text-sm text-zinc-500">Chưa có bàn nào được đặt.</p>
				<ul data-bookings class="mt-3 flex flex-col gap-2"></ul>
			</section>
			<p data-summary aria-live="polite" class="sticky bottom-4 mt-6 rounded-2xl border border-white/60 bg-white/90 px-4 py-3 text-center text-sm font-medium shadow-lg backdrop-blur-md supports-[backdrop-filter]:bg-white/60"></p>
		</main>
		<template data-booking-template>
			<li data-booking class="flex items-center justify-between rounded-xl border border-emerald-100 bg-white px-4 py-3 shadow-sm transition-[opacity,translate] duration-500 motion-reduce:transition-none">
				<div>
					<p data-booking-code class="text-xs text-zinc-500"></p>
					<p data-booking-time class="text-lg font-bold tabular-nums"></p>
					<p class="text-sm text-zinc-600"><span data-booking-name></span> · <span data-booking-guests></span></p>
				</div>
				<button type="button" data-cancel class="rounded-lg border border-rose-200 px-3 py-1.5 text-sm font-medium text-rose-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rose-500">Huỷ</button>
			</li>
		</template>
		<script src="script.js"></script>
	</body>
</html>
