<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Bài 009 - Quiz kính mờ</title>
		<link rel="stylesheet" href="../../build/tailwind.css" />
	</head>
	<body class="font-sans leading-normal">
		<div class="relative min-h-screen overflow-hidden bg-slate-900 px-4 py-10">
			<div aria-hidden="true" class="absolute -top-16 -left-16 size-72 rounded-full bg-linear-to-br from-pink-500 to-orange-400"></div>
			<div aria-hidden="true" class="absolute -right-20 bottom-10 size-80 rounded-full bg-linear-to-br from-sky-400 to-indigo-600"></div>
			<main class="mx-auto max-w-md">
				<section data-card class="group rounded-2xl border border-white/30 bg-slate-800/90 p-6 text-white shadow-2xl inset-shadow-sm inset-shadow-white/40">
					<div class="group-data-done:hidden">
						<p data-counter class="text-sm text-white/70 tabular-nums"></p>
						<h1 data-question id="question" tabindex="-1" class="mt-2 text-xl font-semibold focus:outline-none"></h1>
						<form data-form novalidate class="mt-4">
							<fieldset data-fieldset aria-labelledby="question" class="flex min-w-0 flex-col gap-3"></fieldset>
							<p data-feedback aria-live="polite" class="mt-3 min-h-5 text-sm"></p>
							<button data-submit type="submit" class="mt-4 w-full cursor-pointer rounded-xl bg-white py-2.5 font-semibold text-slate-900 hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white focus-visible:outline-solid">Trả lời</button>
						</form>
					</div>
					<div class="hidden text-center group-data-done:block">
						<h2 data-done-title tabindex="-1" class="text-2xl font-bold focus:outline-none">Hoàn thành!</h2>
						<p data-score aria-live="polite" class="mt-2 text-lg"></p>
						<button data-restart type="button" class="mt-4 w-full cursor-pointer rounded-xl bg-white py-2.5 font-semibold text-slate-900 hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white focus-visible:outline-solid">Làm lại</button>
					</div>
				</section>
			</main>
		</div>
		<template data-option-template>
			<label data-option class="flex cursor-pointer items-center gap-3 rounded-xl border border-white/30 bg-white/10 px-4 py-3 hover:bg-white/20 data-[state=correct]:border-emerald-300 data-[state=correct]:bg-emerald-400/40 data-[state=wrong]:border-rose-300 data-[state=wrong]:bg-rose-400/40">
				<input data-option-input type="radio" name="answer" class="size-5 accent-pink-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white focus-visible:outline-solid" />
				<span data-option-text></span>
			</label>
		</template>
		<script src="script.js"></script>
	</body>
</html>
